<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar - Studio Kamu</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { accent: '#4A6B5D', accentsoft: '#EBF1ED', inksoft: '#64748B' } }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F4F7F5]">

  <div class="auth-wrap">
    <div class="w-full max-w-md">
      
      <a href="index.html" class="inline-block mb-4 text-sm font-medium text-inksoft hover:text-accent transition-colors">
        &larr; Kembali ke Beranda
      </a>

      <div class="auth-card">
        <div class="auth-tabs" id="tabContainer">
          <div class="auth-tab active" id="btnTabLogin" onclick="switchTab('login')">Masuk</div>
          <div class="auth-tab" id="btnTabDaftar" onclick="switchTab('daftar')">Buat Akun</div>
        </div>

        <div id="formMsgAuth" class="form-msg"></div>

        <form id="formLogin">
          <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="nama@email.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <div class="relative">
              <input type="password" id="loginPassword" placeholder="••••••••" required style="padding-right: 40px;">
              <button type="button" onclick="togglePassword('loginPassword', this)" class="absolute inset-y-0 right-0 flex items-center pr-3 text-inksoft hover:text-accent focus:outline-none transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
              </button>
            </div>
          </div>
          <div class="flex justify-between items-center mt-2 mb-6">
            <label class="flex items-center text-sm text-inksoft cursor-pointer">
              <input type="checkbox" class="mr-2 rounded border-gray-300 text-accent focus:ring-accent"> Ingat saya
            </label>
            <a href="#" onclick="switchTab('lupa')" class="text-sm font-medium text-accent hover:underline">Lupa password?</a>
          </div>
          <button type="submit" id="btnLogin" class="btn btn-primary btn-block">Masuk</button>
        </form>

        <form id="formDaftar" style="display: none;">
          <div class="field">
            <label>Nama Lengkap</label>
            <input type="text" id="daftarNama" placeholder="Nama Kamu" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="daftarEmail" placeholder="nama@email.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <div class="relative">
              <input type="password" id="daftarPassword" placeholder="Buat password (min. 6 karakter)" required minlength="6" style="padding-right: 40px;">
              <button type="button" onclick="togglePassword('daftarPassword', this)" class="absolute inset-y-0 right-0 flex items-center pr-3 text-inksoft hover:text-accent focus:outline-none transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>Kode Akses (Opsional)</label>
            <input type="text" id="daftarKode" placeholder="Kode dari pembelian (jika ada)">
          </div>
          <button type="submit" id="btnDaftar" class="btn btn-primary btn-block mt-6">Buat Akun</button>
        </form>

        <form id="formLupa" style="display: none;">
          <h3 class="font-bold text-lg mb-2">Reset Password</h3>
          <p class="text-sm text-inksoft mb-4">Masukkan email yang terdaftar. Kami akan mengeceknya di sistem.</p>
          <div id="formMsgLupa" class="form-msg"></div>
          
          <div class="field">
            <label>Email Anda</label>
            <input type="email" id="lupaEmail" placeholder="nama@email.com" required>
          </div>
          
          <button type="submit" id="btnLupa" class="btn btn-primary btn-block mt-4">Kirim Permintaan Reset</button>
          
          <div class="text-center mt-4">
            <a href="#" onclick="switchTab('login')" class="text-sm text-inksoft hover:text-accent">&larr; Kembali ke Login</a>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="js/script.js"></script>

  <script>
    // ----------------------------------------------------
    // 1. LOGIKA UNTUK BERPINDAH TAB
    // ----------------------------------------------------
    function switchTab(tabName) {
      document.getElementById('formLogin').style.display = 'none';
      document.getElementById('formDaftar').style.display = 'none';
      document.getElementById('formLupa').style.display = 'none';
      
      let tabContainer = document.getElementById('tabContainer');
      
      if (tabName === 'login') {
        document.getElementById('formLogin').style.display = 'block';
        tabContainer.style.display = 'flex';
        document.getElementById('btnTabLogin').classList.add('active');
        document.getElementById('btnTabDaftar').classList.remove('active');
      } 
      else if (tabName === 'daftar') {
        document.getElementById('formDaftar').style.display = 'block';
        tabContainer.style.display = 'flex';
        document.getElementById('btnTabDaftar').classList.add('active');
        document.getElementById('btnTabLogin').classList.remove('active');
      } 
      else if (tabName === 'lupa') {
        document.getElementById('formLupa').style.display = 'block';
        tabContainer.style.display = 'none';
      }
      
      hideFormMessage('formMsgAuth');
      hideFormMessage('formMsgLupa');
    }

    // ----------------------------------------------------
    // 2. LOGIKA TOGGLE PASSWORD (IKON MATA)
    // ----------------------------------------------------
    function togglePassword(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        // Ubah jadi ikon mata tercoret (ditutup)
        btnEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>`;
      } else {
        input.type = 'password';
        // Kembali ke ikon mata terbuka
        btnEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>`;
      }
    }

    // ----------------------------------------------------
    // 3. LOGIKA FETCH API (Ke Google Apps Script)
    // ----------------------------------------------------
    
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      
      setButtonLoading(btn, true, 'Memeriksa...');
      hideFormMessage('formMsgAuth');

      const data = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };

      const res = await fetchAPI('loginUser', data);
      setButtonLoading(btn, false, 'Masuk', 'Masuk');

      if (res.success) {
        showFormMessage('formMsgAuth', 'Berhasil! Mengarahkan ke dashboard...', 'success');
        localStorage.setItem('userToken', res.data ? res.data.token : res.token);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
      } else {
        showFormMessage('formMsgAuth', res.message, 'error');
      }
    });

    document.getElementById('formDaftar').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnDaftar');
      
      setButtonLoading(btn, true, 'Membuat Akun...');
      hideFormMessage('formMsgAuth');

      const data = {
        nama: document.getElementById('daftarNama').value,
        email: document.getElementById('daftarEmail').value,
        password: document.getElementById('daftarPassword').value,
        kodeAkses: document.getElementById('daftarKode').value
      };

      const res = await fetchAPI('registerUser', data);
      setButtonLoading(btn, false, 'Buat Akun', 'Buat Akun');

      if (res.success) {
        showFormMessage('formMsgAuth', 'Akun berhasil dibuat! Silakan masuk.', 'success');
        document.getElementById('formDaftar').reset();
        setTimeout(() => { switchTab('login'); }, 1500);
      } else {
        showFormMessage('formMsgAuth', res.message, 'error');
      }
    });

    document.getElementById('formLupa').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLupa');
      
      setButtonLoading(btn, true, 'Mengirim...');
      hideFormMessage('formMsgLupa');

      const data = { email: document.getElementById('lupaEmail').value };
      const res = await fetchAPI('requestPasswordReset', data);
      
      setButtonLoading(btn, false, 'Kirim Permintaan Reset', 'Kirim Permintaan Reset');

      if (res.success) {
        showFormMessage('formMsgLupa', res.message, 'success');
        document.getElementById('formLupa').reset();
      } else {
        showFormMessage('formMsgLupa', res.message, 'error');
      }
    });
  </script>
</body>
</html>
